name: Build GitHub Pages

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-branch:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include:
          - key: mod-ale
            url: https://github.com/azerothcore/mod-ale/archive/refs/heads/master.zip
            dest: source/mod-ale
          - key: ElunaTrinityCore
            url: https://github.com/ElunaLuaEngine/Eluna/archive/refs/heads/master.zip
            dest: source/Eluna
          - key: ElunaCMangos
            url: https://github.com/ElunaLuaEngine/Eluna/archive/refs/heads/master.zip
            dest: source/Eluna
          - key: ElunaMangos
            url: https://github.com/ElunaLuaEngine/Eluna/archive/refs/heads/master.zip
            dest: source/Eluna
          - key: ElunaVMangos
            url: https://github.com/ElunaLuaEngine/Eluna/archive/refs/heads/master.zip
            dest: source/Eluna
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, curl

      - name: Download and extract source
        run: |
          mkdir -p ${{ matrix.dest }}
          curl -sL ${{ matrix.url }} -o source.zip
          unzip -q source.zip -d _extracted
          extracted=$(find _extracted -mindepth 1 -maxdepth 1 -type d | head -1)
          cp -r "$extracted/." ${{ matrix.dest }}/
          rm -rf _extracted source.zip

      - name: Generate static site
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ matrix.key }}
        run: php generate_github_docs.php

      - name: Deploy branch site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: web
          destination_dir: ${{ matrix.key }}
          keep_files: true

  build-index:
    runs-on: ubuntu-latest
    needs: build-branch
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, curl

      - name: Generate root index
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: __index__
        run: php generate_github_docs.php

      - name: Deploy root index
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: web
          destination_dir: .
          keep_files: true
