name: Build and deploy GitHub Pages

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, curl

      - name: Download and extract sources
        run: |
          set -euo pipefail
          php generate_github_docs.php --list-sources | while IFS=$'\t' read -r dest url; do
            echo "Downloading ${url} to ${dest}"
            mkdir -p "${dest}"
            curl -fsSL "${url}" -o source.zip
            rm -rf _extracted
            unzip -q source.zip -d _extracted
            extracted=$(find _extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)
            cp -r "${extracted}/." "${dest}/"
            rm -rf _extracted source.zip
          done

      - name: Generate static site
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          BUILD_ALL: '1'
        run: php generate_github_docs.php

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
